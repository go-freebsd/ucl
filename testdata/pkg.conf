# A pkg.conf shaped document, used by the examples.
ABI = "FreeBSD:14:amd64";

REPOS_DIR [
    "/etc/pkg",
    "/usr/local/etc/pkg/repos",
]

FreeBSD {
    url            = "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly";
    mirror_type    = "srv";
    signature_type = "fingerprints";
    enabled        = yes;
}

FETCH_TIMEOUT  = 30s;
DEVELOPER_MODE = off;
